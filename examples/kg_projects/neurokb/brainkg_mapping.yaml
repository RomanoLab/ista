# BrainKG Data Loading Mapping Specification
# Builds a knowledge graph for neurological disease and drug discovery research.
#
# Data sources:
#   - DrugBank 2025-11-19: Drugs, indications, adverse effects,
#     contraindications, drug-drug interactions, ADMET
#   - NCBI Gene: Human gene data
#   - Hetionet v1.0: Biomedical relationships
#   - DisGeNET: Disease-gene associations
#   - AOP-DB: Adverse Outcome Pathways (MySQL)
#
# Preprocessing required:
#   python preprocess_drugbank.py ${DATA_DIR}/drugbank/2025-11-19 \
#                                 ${DATA_DIR}/drugbank/2025-11-19/CUSTOM
#
# Environment variables:
#   DATA_DIR   - Root data directory
#   MYSQL_HOST - AOP-DB MySQL host (optional)
#   MYSQL_USER - AOP-DB MySQL user (optional)
#   MYSQL_PASSWORD - AOP-DB MySQL password (optional)

version: "1.0"
base_iri: "http://jdr.bio/ontologies/brainkg.owl#"

# ═══════════════════════════════════════════════════════════════════════════
# Transforms
# ═══════════════════════════════════════════════════════════════════════════
transforms:
  extract_after_colons:
    type: split
    params:
      delimiter: "::"
      index: "-1"

  to_integer:
    type: to_int

  extract_int_id:
    type: chain
    params:
      transforms: "extract_after_colons,to_integer"

  # Extract ID after single ":" (for AOP-Wiki KER Event:NNN format)
  extract_after_colon:
    type: split
    params:
      delimiter: ":"
      index: "-1"

  extract_ker_id:
    type: chain
    params:
      transforms: "extract_after_colon,to_integer"

# ═══════════════════════════════════════════════════════════════════════════
# Shared connection anchor for AOP-DB
# ═══════════════════════════════════════════════════════════════════════════
_aopdb_connection: &aopdb_conn
  host: "${MYSQL_HOST}"
  port: 3306
  database: aopdb
  username: "${MYSQL_USER}"
  password: "${MYSQL_PASSWORD}"

# ═══════════════════════════════════════════════════════════════════════════
# Data Sources
# ═══════════════════════════════════════════════════════════════════════════
sources:
  # ── DrugBank ─────────────────────────────────────────────────────────
  drugbank_drugs:
    type: csv
    path: "${DATA_DIR}/drugbank/2025-11-19/drugs.csv"

  drugbank_interactions:
    type: csv
    path: "${DATA_DIR}/drugbank/2025-11-19/structured_drug_interactions.csv"

  # Preprocessed DrugBank files (from preprocess_drugbank.py)
  drugbank_indications:
    type: tsv
    path: "${DATA_DIR}/drugbank/2025-11-19/CUSTOM/indications_flat.tsv"

  drugbank_adverse_effects:
    type: tsv
    path: "${DATA_DIR}/drugbank/2025-11-19/CUSTOM/adverse_effects_flat.tsv"

  drugbank_contraindications:
    type: tsv
    path: "${DATA_DIR}/drugbank/2025-11-19/CUSTOM/contraindications_flat.tsv"

  drugbank_admet:
    type: tsv
    path: "${DATA_DIR}/drugbank/2025-11-19/CUSTOM/admet_flat.tsv"

  # ── NCBI Gene ────────────────────────────────────────────────────────
  ncbi_genes:
    type: tsv
    path: "${DATA_DIR}/ncbigene/Homo_sapiens.gene_info"

  # ── Hetionet ─────────────────────────────────────────────────────────
  hetionet_nodes:
    type: tsv
    path: "${DATA_DIR}/hetionet/hetionet-v1.0-nodes.tsv"

  hetionet_edges:
    type: tsv
    path: "${DATA_DIR}/hetionet/hetionet-v1.0-edges.sif"

  # ── DisGeNET ─────────────────────────────────────────────────────────
  disgenet_diseases:
    type: tsv
    path: "${DATA_DIR}/disgenet/disease_mappings_to_attributes.tsv"

  disgenet_gene_disease:
    type: tsv
    path: "${DATA_DIR}/disgenet/curated_gene_disease_associations.tsv"

  # ── AOP-DB (MySQL) ──────────────────────────────────────────────────
  aopdb_pathways:
    type: mysql
    connection: *aopdb_conn
    query: |
      SELECT DISTINCT path_id, path_name, ext_source
      FROM pathway_gene
      WHERE tax_id = 9606

  aopdb_gene_pathways:
    type: mysql
    connection: *aopdb_conn
    query: |
      SELECT entrez, path_id
      FROM pathway_gene
      WHERE tax_id = 9606

  aopdb_events:
    type: mysql
    connection: *aopdb_conn
    table: event_info

  aopdb_mie_events:
    type: mysql
    connection: *aopdb_conn
    query: |
      SELECT event_id, event_name
      FROM event_info
      WHERE event_type = 'molecular-initiating-event'

  aopdb_ao_events:
    type: mysql
    connection: *aopdb_conn
    query: |
      SELECT event_id, event_name
      FROM event_info
      WHERE event_type = 'adverse-outcome'

  aopdb_aops:
    type: mysql
    connection: *aopdb_conn
    table: aop_info

  aopwiki_kers:
    type: tsv
    path: "${DATA_DIR}/aopwiki/aop_ke_ker.tsv"
    has_headers: false
    columns:
      [
        aop_id,
        upstream_event_id,
        downstream_event_id,
        relationship_id,
        direct_or_indirect,
        evidence_level,
        extra,
      ]

# ═══════════════════════════════════════════════════════════════════════════
# Node Mappings
# ═══════════════════════════════════════════════════════════════════════════
node_mappings:
  # ── Drug (CREATE from DrugBank) ──────────────────────────────────────
  - name: "Drug (DrugBank primary)"
    source: drugbank_drugs
    target_class: Drug
    mode: create
    iri_column: drugbank_id
    properties:
      - { column: drugbank_id, property: xrefDrugbank }
      - { column: cas_number, property: xrefCasRN }
      - { column: name, property: commonName }

  # ── Drug ADMET enrichment (BBB penetration) ─────────────────────────
  - name: "Drug (ADMET BBB enrichment)"
    source: drugbank_admet
    target_class: Drug
    mode: enrich
    match:
      source_column: drugbank_id
      target_property: xrefDrugbank
    properties:
      - { column: bbb, property: bbb }
      - { column: bbb_probability, property: bbbProbability }

  # ── Gene (CREATE from NCBI) ─────────────────────────────────────────
  - name: "Gene (NCBI Human Genes)"
    source: ncbi_genes
    target_class: Gene
    mode: create
    iri_column: Symbol
    properties:
      - { column: GeneID, property: xrefNcbiGene }
      - { column: Symbol, property: geneSymbol }
      - { column: type_of_gene, property: typeOfGene }
      - { column: Full_name_from_nomenclature_authority, property: commonName }

  # ── Disease (CREATE from DisGeNET) ──────────────────────────────────
  - name: "Disease (DisGeNET)"
    source: disgenet_diseases
    target_class: Disease
    mode: create
    iri_column: diseaseId
    properties:
      - { column: diseaseId, property: xrefUmlsCUI }
      - { column: name, property: commonName }
      - { column: doClassId, property: xrefDiseaseOntology }

  # ── Disease enrichment from DrugBank indications ────────────────────
  # (Creates Disease nodes for conditions not already in DisGeNET)
  - name: "Disease (from DrugBank indications)"
    source: drugbank_indications
    target_class: Disease
    mode: create
    iri_column: umls_cui
    properties:
      - { column: umls_cui, property: xrefUmlsCUI }
      - { column: condition_name, property: commonName }

  # ── Hetionet entity types ───────────────────────────────────────────
  - name: "DrugClass (Hetionet)"
    source: hetionet_nodes
    target_class: DrugClass
    mode: create
    iri_column: name
    filter: { column: kind, value: "Pharmacologic Class", contains: false }
    properties:
      - {
          column: id,
          property: xrefNciThesaurus,
          transform: extract_after_colons,
        }
      - { column: name, property: commonName }

  - name: "Symptom (Hetionet)"
    source: hetionet_nodes
    target_class: Symptom
    mode: create
    iri_column: name
    filter: { column: kind, value: "Symptom", contains: false }
    properties:
      - { column: id, property: xrefMeSH, transform: extract_after_colons }
      - { column: name, property: commonName }

  # Side Effects are distinct from Symptoms in Hetionet but serve the same
  # role in BrainKG. Their IDs are UMLS CUIs (e.g. Side Effect::C0032584).
  - name: "Side Effect (Hetionet)"
    source: hetionet_nodes
    target_class: Symptom
    mode: create
    iri_column: name
    filter: { column: kind, value: "Side Effect", contains: false }
    properties:
      - { column: id, property: xrefUmlsCUI, transform: extract_after_colons }
      - { column: name, property: commonName }

  - name: "BodyPart (Hetionet)"
    source: hetionet_nodes
    target_class: BodyPart
    mode: create
    iri_column: name
    filter: { column: kind, value: "Anatomy", contains: false }
    properties:
      - { column: id, property: xrefUberon, transform: extract_after_colons }
      - { column: name, property: commonName }

  - name: "BiologicalProcess (Hetionet)"
    source: hetionet_nodes
    target_class: BiologicalProcess
    mode: create
    iri_column: name
    filter: { column: kind, value: "Biological Process", contains: false }
    properties:
      - {
          column: id,
          property: xrefGeneOntology,
          transform: extract_after_colons,
        }
      - { column: name, property: commonName }

  - name: "MolecularFunction (Hetionet)"
    source: hetionet_nodes
    target_class: MolecularFunction
    mode: create
    iri_column: name
    filter: { column: kind, value: "Molecular Function", contains: false }
    properties:
      - {
          column: id,
          property: xrefGeneOntology,
          transform: extract_after_colons,
        }
      - { column: name, property: commonName }

  - name: "CellularComponent (Hetionet)"
    source: hetionet_nodes
    target_class: CellularComponent
    mode: create
    iri_column: name
    filter: { column: kind, value: "Cellular Component", contains: false }
    properties:
      - {
          column: id,
          property: xrefGeneOntology,
          transform: extract_after_colons,
        }
      - { column: name, property: commonName }

  # ── AOP-DB entities ─────────────────────────────────────────────────
  - name: "Pathway (AOP-DB)"
    source: aopdb_pathways
    target_class: Pathway
    mode: create
    iri_column: path_id
    properties:
      - { column: path_id, property: pathwayId }
      - { column: path_name, property: commonName }
      - { column: ext_source, property: sourceDatabase }

  - name: "KeyEvent (AOP-DB)"
    source: aopdb_events
    target_class: KeyEvent
    mode: create
    iri_column: event_id
    properties:
      - { column: event_id, property: xrefAOPWikiKEID }
      - { column: event_name, property: commonName }

  - name: "KeyEvent MIE classification"
    source: aopdb_mie_events
    target_class: KeyEvent
    mode: enrich
    match: { source_column: event_id, target_property: xrefAOPWikiKEID }
    additional_classes: [MolecularInitiatingEvent]

  - name: "KeyEvent AO classification"
    source: aopdb_ao_events
    target_class: KeyEvent
    mode: enrich
    match: { source_column: event_id, target_property: xrefAOPWikiKEID }
    additional_classes: [AdverseOutcome]

  - name: "AOP (AOP-DB)"
    source: aopdb_aops
    target_class: AOP
    mode: create
    iri_column: AOP_id
    properties:
      - { column: AOP_id, property: xrefAOPWikiAOPID }
      - { column: AOP_name, property: commonName }

# ═══════════════════════════════════════════════════════════════════════════
# Relationship Mappings
# ═══════════════════════════════════════════════════════════════════════════
relationship_mappings:
  # ── DrugBank Drug-Disease relationships ─────────────────────────────
  - name: "Drug treats Disease (DrugBank indications)"
    source: drugbank_indications
    relationship: drugTreatsDisease
    subject:
      class: Drug
      column: drugbank_id
      match_property: xrefDrugbank
    object:
      class: Disease
      column: umls_cui
      match_property: xrefUmlsCUI

  - name: "Drug causes adverse event"
    source: drugbank_adverse_effects
    relationship: drugCausesAdverseEvent
    subject:
      class: Drug
      column: drugbank_id
      match_property: xrefDrugbank
    object:
      class: Disease
      column: umls_cui
      match_property: xrefUmlsCUI

  - name: "Drug contraindicated for Disease"
    source: drugbank_contraindications
    relationship: drugContraindicatedForDisease
    subject:
      class: Drug
      column: drugbank_id
      match_property: xrefDrugbank
    object:
      class: Disease
      column: umls_cui
      match_property: xrefUmlsCUI

  # ── DrugBank Drug-Drug Interactions ─────────────────────────────────
  - name: "Drug interacts with Drug (Major severity)"
    source: drugbank_interactions
    relationship: drugInteractsWithDrug
    filter:
      column: severity
      value: "2"
      contains: false
    subject:
      class: Drug
      column: subject_drug_drugbank_id
      match_property: xrefDrugbank
    object:
      class: Drug
      column: affected_drug_drugbank_id
      match_property: xrefDrugbank

  # ── DisGeNET Gene-Disease ───────────────────────────────────────────
  - name: "Gene associates with Disease"
    source: disgenet_gene_disease
    relationship: geneAssociatesWithDisease
    filter: { column: diseaseType, value: "disease", contains: true }
    subject:
      class: Gene
      column: geneSymbol
      match_property: geneSymbol
    object:
      class: Disease
      column: diseaseId
      match_property: xrefUmlsCUI

  # ── Hetionet Chemical-Gene ──────────────────────────────────────────
  # NOTE: All Hetionet edge columns use "Kind::ID" format (e.g.
  # "Compound::DB00448", "Gene::9021"). The extract_after_colons
  # transform strips the prefix to get the bare ID for matching.
  - name: "Chemical increases Gene expression (CuG)"
    source: hetionet_edges
    relationship: chemicalIncreasesExpression
    filter: { column: metaedge, value: "CuG", contains: false }
    subject:
      class: Drug
      column: source
      match_property: xrefDrugbank
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  - name: "Chemical decreases Gene expression (CdG)"
    source: hetionet_edges
    relationship: chemicalDecreasesExpression
    filter: { column: metaedge, value: "CdG", contains: false }
    subject:
      class: Drug
      column: source
      match_property: xrefDrugbank
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  - name: "Chemical binds Gene (CbG)"
    source: hetionet_edges
    relationship: chemicalBindsGene
    filter: { column: metaedge, value: "CbG", contains: false }
    subject:
      class: Drug
      column: source
      match_property: xrefDrugbank
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  # ── Hetionet Gene-Gene ──────────────────────────────────────────────
  - name: "Gene interacts with Gene (GiG)"
    source: hetionet_edges
    relationship: geneInteractsWithGene
    filter: { column: metaedge, value: "GiG", contains: false }
    subject:
      class: Gene
      column: source
      match_property: xrefNcbiGene
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  - name: "Gene covaries with Gene (GcG)"
    source: hetionet_edges
    relationship: geneCovariesWithGene
    filter: { column: metaedge, value: "GcG", contains: false }
    subject:
      class: Gene
      column: source
      match_property: xrefNcbiGene
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  - name: "Gene regulates Gene (Gr>G)"
    source: hetionet_edges
    relationship: geneRegulatesGene
    filter: { column: metaedge, value: "Gr>G", contains: false }
    subject:
      class: Gene
      column: source
      match_property: xrefNcbiGene
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  # ── Hetionet Drug relationships ─────────────────────────────────────
  - name: "Drug in pharmacologic class (PCiC)"
    source: hetionet_edges
    relationship: drugInClass
    filter: { column: metaedge, value: "PCiC", contains: false }
    subject:
      class: Drug
      column: target
      match_property: xrefDrugbank
      transform: extract_after_colons
    object:
      class: DrugClass
      column: source
      match_property: xrefNciThesaurus
      transform: extract_after_colons

  - name: "Drug causes side effect (CcSE)"
    source: hetionet_edges
    relationship: drugCausesEffect
    filter: { column: metaedge, value: "CcSE", contains: false }
    subject:
      class: Drug
      column: source
      match_property: xrefDrugbank
      transform: extract_after_colons
    object:
      class: Symptom
      column: target
      match_property: xrefUmlsCUI
      transform: extract_after_colons

  # ── Hetionet Disease relationships ──────────────────────────────────
  - name: "Symptom manifestation of Disease (DpS)"
    source: hetionet_edges
    relationship: symptomManifestationOfDisease
    filter: { column: metaedge, value: "DpS", contains: false }
    subject:
      class: Symptom
      column: target
      match_property: xrefMeSH
      transform: extract_after_colons
    object:
      class: Disease
      column: source
      match_property: xrefDiseaseOntology
      transform: extract_after_colons

  - name: "Disease localizes to Anatomy (DlA)"
    source: hetionet_edges
    relationship: diseaseLocalizesToAnatomy
    filter: { column: metaedge, value: "DlA", contains: false }
    subject:
      class: Disease
      column: source
      match_property: xrefDiseaseOntology
      transform: extract_after_colons
    object:
      class: BodyPart
      column: target
      match_property: xrefUberon
      transform: extract_after_colons

  - name: "Disease associates with Disease (DrD)"
    source: hetionet_edges
    relationship: diseaseAssociatesWithDisease
    filter: { column: metaedge, value: "DrD", contains: false }
    subject:
      class: Disease
      column: source
      match_property: xrefDiseaseOntology
      transform: extract_after_colons
    object:
      class: Disease
      column: target
      match_property: xrefDiseaseOntology
      transform: extract_after_colons

  # ── Hetionet Gene Ontology ──────────────────────────────────────────
  - name: "Gene participates in Biological Process (GpBP)"
    source: hetionet_edges
    relationship: geneParticipatesInBiologicalProcess
    filter: { column: metaedge, value: "GpBP", contains: false }
    subject:
      class: Gene
      column: source
      match_property: xrefNcbiGene
      transform: extract_after_colons
    object:
      class: BiologicalProcess
      column: target
      match_property: xrefGeneOntology
      transform: extract_after_colons

  - name: "Gene associated with Cellular Component (GpCC)"
    source: hetionet_edges
    relationship: geneAssociatedWithCellularComponent
    filter: { column: metaedge, value: "GpCC", contains: false }
    subject:
      class: Gene
      column: source
      match_property: xrefNcbiGene
      transform: extract_after_colons
    object:
      class: CellularComponent
      column: target
      match_property: xrefGeneOntology
      transform: extract_after_colons

  - name: "Gene has Molecular Function (GpMF)"
    source: hetionet_edges
    relationship: geneHasMolecularFunction
    filter: { column: metaedge, value: "GpMF", contains: false }
    subject:
      class: Gene
      column: source
      match_property: xrefNcbiGene
      transform: extract_after_colons
    object:
      class: MolecularFunction
      column: target
      match_property: xrefGeneOntology
      transform: extract_after_colons

  # ── Hetionet Anatomy-Gene ───────────────────────────────────────────
  - name: "BodyPart overexpresses Gene (AuG)"
    source: hetionet_edges
    relationship: bodyPartOverexpressesGene
    filter: { column: metaedge, value: "AuG", contains: false }
    subject:
      class: BodyPart
      column: source
      match_property: xrefUberon
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  - name: "BodyPart underexpresses Gene (AdG)"
    source: hetionet_edges
    relationship: bodyPartUnderexpressesGene
    filter: { column: metaedge, value: "AdG", contains: false }
    subject:
      class: BodyPart
      column: source
      match_property: xrefUberon
      transform: extract_after_colons
    object:
      class: Gene
      column: target
      match_property: xrefNcbiGene
      transform: extract_after_colons

  # ── AOP-DB relationships ────────────────────────────────────────────
  - name: "Gene in Pathway"
    source: aopdb_gene_pathways
    relationship: geneInPathway
    inverse_relationship: pathwayContainsGene
    subject:
      class: Gene
      column: entrez
      match_property: xrefNcbiGene
    object:
      class: Pathway
      column: path_id
      match_property: pathwayId

  - name: "KeyEvent included in AOP"
    source: aopdb_events
    relationship: keIncludedInAOP
    subject:
      class: KeyEvent
      column: event_id
      match_property: xrefAOPWikiKEID
    object:
      class: AOP
      column: AOP_ids
      match_property: xrefAOPWikiAOPID
      multi_value_delimiter: "; "

  # ── AOP-Wiki KER relationships ──────────────────────────────────────
  - name: "KeyEvent triggers KeyEvent (adjacent KERs)"
    source: aopwiki_kers
    relationship: keyEventTriggers
    filter: { column: direct_or_indirect, value: "adjacent" }
    subject:
      class: KeyEvent
      column: upstream_event_id
      match_property: xrefAOPWikiKEID
      transform: extract_ker_id
    object:
      class: KeyEvent
      column: downstream_event_id
      match_property: xrefAOPWikiKEID
      transform: extract_ker_id
